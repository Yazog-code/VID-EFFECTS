[project]
name = "vid-effects"
version = "0.1.0"
description = "Appliquer des effets Python à une vidéo"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10",
    "moviepy>=2.1,<3",
    "imageio-ffmpeg>=0.5",
    "gradio>=5,<7",
    # Fenêtre d'application native sur Mac ; ailleurs, la page s'ouvre dans le navigateur.
    "pywebview>=5; sys_platform == 'darwin'",
]

[project.scripts]
vid-effects = "vid_effects.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vid_effects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
